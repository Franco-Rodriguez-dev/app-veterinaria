<div class="title">
  <h1>Listado de Personas</h1>
</div>

<app-spinner *ngIf="loading"></app-spinner>

<div class="container">
  <mat-form-field appearance="outline">
    <mat-label>Buscar</mat-label>
    <input
      matInput
      (keyup)="applyFilter($event)"
      placeholder="Filtrar por nombre o apellido"
      #input
      autocomplete="off"
    />
  </mat-form-field>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
      <td mat-cell *matCellDef="let persona">{{ persona.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="apellido">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Apellido</th>
      <td mat-cell *matCellDef="let persona">{{ persona.apellido }}</td>
    </ng-container>

    <ng-container matColumnDef="edad">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Edad</th>
      <td mat-cell *matCellDef="let persona">{{ persona.edad }}</td>
    </ng-container>

    <ng-container matColumnDef="telefono">
      <th mat-header-cell *matHeaderCellDef>Telefono</th>
      <td mat-cell *matCellDef="let persona">{{ persona.telefono }}</td>
    </ng-container>

    <ng-container matColumnDef="cantMascotas">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Cant. Mascotas</th>
      <td mat-cell *matCellDef="let persona">{{ persona.cantMascotas }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons
    aria-label="Seleccionar pagina"
  ></mat-paginator>

  <button mat-raised-button color="primary" class="back-action" routerLink="/listadoGeneral">
    <mat-icon fontIcon="arrow_back"></mat-icon>
    Volver
  </button>
</div>
