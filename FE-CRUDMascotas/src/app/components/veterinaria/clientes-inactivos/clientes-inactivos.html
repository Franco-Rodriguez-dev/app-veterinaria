<div class="title">
  <h1>Clientes dados de baja</h1>
</div>

<app-spinner *ngIf="loading"></app-spinner>

<div class="container">
  <div class="toolbar">
    <mat-form-field class="buscador" appearance="outline">
      <mat-label>Buscar</mat-label>
      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="Buscar por cliente, telefono o usuario"
        autocomplete="off"
      />
    </mat-form-field>

    <button mat-raised-button color="primary" class="back-action" (click)="volver()">
      <mat-icon fontIcon="arrow_back"></mat-icon>
      Volver
    </button>
  </div>

  <div class="empty-state" *ngIf="!loading && dataSource.data.length === 0">
    No hay clientes dados de baja.
  </div>

  <table *ngIf="dataSource.data.length > 0" mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
      <td mat-cell *matCellDef="let c">{{ c.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="apellido">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Apellido</th>
      <td mat-cell *matCellDef="let c">{{ c.apellido }}</td>
    </ng-container>

    <ng-container matColumnDef="telefono">
      <th mat-header-cell *matHeaderCellDef>Telefono</th>
      <td mat-cell *matCellDef="let c">{{ c.telefono }}</td>
    </ng-container>

    <ng-container matColumnDef="username">
      <th mat-header-cell *matHeaderCellDef>Usuario</th>
      <td mat-cell *matCellDef="let c">{{ c.username }}</td>
    </ng-container>

    <ng-container matColumnDef="cantidadMascotas">
      <th mat-header-cell *matHeaderCellDef>Mascotas</th>
      <td mat-cell *matCellDef="let c">{{ c.cantidadMascotas }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let c">
        <button mat-raised-button color="primary" class="primary-action" (click)="reactivar(c)">
          <mat-icon fontIcon="restore"></mat-icon>
          Reactivar
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    *ngIf="dataSource.data.length > 0"
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons
    aria-label="Seleccionar pagina"
  ></mat-paginator>
</div>
